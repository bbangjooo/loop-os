schema = "ros2-contract-v1"
integrity = ["objective.py"]

[project]
id = "hill-descent"

[frame]
generation = 1
class = "hill_descent"
mechanism = "value.txt holds a number, the objective reads it, and the agent can lower it by one per iteration. Falsified if the number fails to fall while the guard keeps passing."

[budget]
iterations_total = 6

[agent]
command = ["python3", "agent.py"]
timeout_seconds = 60

[[stages]]
id = "main"
prompt = "Lower the number in value.txt by exactly 1."
iterations = 3

[stages.objective]
command = ["python3", "objective.py"]
direction = "minimize"
margin = 1
target = 0
timeout_seconds = 30
proxy_license = "example contract clause 1: the number is the goal itself, not a proxy for anything outside the system."

[[stages.guards]]
id = "app-intact"
command = ["python3", "-c", "import pathlib,sys; sys.exit(0 if pathlib.Path('app.py').exists() else 1)"]
kind = "exit_zero"
timeout_seconds = 30
