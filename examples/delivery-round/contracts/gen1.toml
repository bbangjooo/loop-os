schema = "ros2-contract-v1"
integrity = ["objective.py", "guard.py"]

[project]
id = "delivery-round"

[frame]
generation = 1
class = "adjacent_swap"
mechanism = "The round was scrambled by history, so neighboring stops are often in the wrong relative order; swapping adjacent stops fixes those inversions one at a time. Falsified if accepted swaps dry up while the round is still visibly poor."

[budget]
iterations_total = 30

[agent]
command = ["python3", "agent_swap.py"]
timeout_seconds = 60

[[stages]]
id = "main"
prompt = "Swap two adjacent stops in tour.json. Keep every city exactly once."
iterations = 10

[stages.objective]
command = ["python3", "objective.py"]
direction = "minimize"
margin = 0.001
target = 280.0
timeout_seconds = 30
proxy_license = "example contract clause 1: total tour length is the goal itself — the driver pays for distance, so no proxy stands between the number and the thing being optimized."

[[stages.guards]]
id = "tour-valid"
command = ["python3", "guard.py"]
kind = "exit_zero"
timeout_seconds = 30
