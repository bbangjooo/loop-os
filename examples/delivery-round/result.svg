    <text x="504" y="71.6" fill="#6b665c" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">2016</text>
    <text x="680" y="216.4" fill="#2b2925" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" text-anchor="end" font-weight="600">1526</text>
    <text x="488" y="272" fill="#6b665c" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">objective per iteration</text>
    <circle cx="494" cy="285" r="3" fill="#2b2925"/>
    <text x="502" y="288" fill="#8b857b" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">kept</text>
    <circle cx="554" cy="285" r="3" fill="#ffffff" stroke="#a63d2f" stroke-width="1.2"/>
    <text x="562" y="288" fill="#8b857b" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">reverted</text>
</svg>
