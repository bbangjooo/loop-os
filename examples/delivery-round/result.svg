<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dr-title dr-desc">
  <title id="dr-title">Delivery round — before and after one Loop OS run</title>
  <desc id="dr-desc">The seed tour crosses itself; after eight iterations of random 2-opt proposals, four accepted and four reverted, the tour is 24 percent shorter. A step chart shows the objective per iteration with reverted proposals as hollow marks off the line.</desc>
  <rect width="100%" height="100%" fill="#f7f5f0"/>
  <text x="24" y="24" fill="#2b2925" font-size="10" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" letter-spacing="0.06em">the problem: visit all 12 delivery stops in the shortest possible round</text>
  <text x="24" y="38" fill="#8b857b" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">agent proposes a random 2-opt move · kernel keeps only what measures shorter</text>
  
    <rect x="24" y="52" width="200" height="200" rx="6" fill="#ffffff" stroke="rgba(43,41,37,0.12)" stroke-width="1"/>
    <polygon points="123.6,152.4 50.5,110.2 125.3,236.0 165.8,79.3 50.5,194.6 196.7,194.6 81.4,79.3 196.7,110.2 81.4,225.5 123.6,68.0 165.8,225.5 40.0,154.1" fill="none" stroke="#6b665c" stroke-width="1.2"/>
    <circle cx="123.6" cy="152.4" r="2.5" fill="#2b2925"/><circle cx="196.7" cy="110.2" r="2.5" fill="#2b2925"/><circle cx="165.8" cy="79.3" r="2.5" fill="#2b2925"/><circle cx="123.6" cy="68.0" r="2.5" fill="#2b2925"/><circle cx="81.4" cy="79.3" r="2.5" fill="#2b2925"/><circle cx="50.5" cy="110.2" r="2.5" fill="#2b2925"/><circle cx="40.0" cy="154.1" r="2.5" fill="#2b2925"/><circle cx="50.5" cy="194.6" r="2.5" fill="#2b2925"/><circle cx="81.4" cy="225.5" r="2.5" fill="#2b2925"/><circle cx="125.3" cy="236.0" r="2.5" fill="#2b2925"/><circle cx="165.8" cy="225.5" r="2.5" fill="#2b2925"/><circle cx="196.7" cy="194.6" r="2.5" fill="#2b2925"/>
    <text x="24" y="272" fill="#6b665c" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">before</text>
    <text x="224" y="272" fill="#6b665c" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" text-anchor="end" font-weight="600">2015.9</text>
  
    <rect x="256" y="52" width="200" height="200" rx="6" fill="#ffffff" stroke="rgba(43,41,37,0.12)" stroke-width="1"/>
    <polygon points="355.6,152.4 357.3,236.0 282.5,110.2 282.5,194.6 313.4,225.5 428.7,110.2 428.7,194.6 313.4,79.3 397.8,79.3 355.6,68.0 397.8,225.5 272.0,154.1" fill="none" stroke="#a63d2f" stroke-width="1.2"/>
    <circle cx="355.6" cy="152.4" r="2.5" fill="#2b2925"/><circle cx="428.7" cy="110.2" r="2.5" fill="#2b2925"/><circle cx="397.8" cy="79.3" r="2.5" fill="#2b2925"/><circle cx="355.6" cy="68.0" r="2.5" fill="#2b2925"/><circle cx="313.4" cy="79.3" r="2.5" fill="#2b2925"/><circle cx="282.5" cy="110.2" r="2.5" fill="#2b2925"/><circle cx="272.0" cy="154.1" r="2.5" fill="#2b2925"/><circle cx="282.5" cy="194.6" r="2.5" fill="#2b2925"/><circle cx="313.4" cy="225.5" r="2.5" fill="#2b2925"/><circle cx="357.3" cy="236.0" r="2.5" fill="#2b2925"/><circle cx="397.8" cy="225.5" r="2.5" fill="#2b2925"/><circle cx="428.7" cy="194.6" r="2.5" fill="#2b2925"/>
    <text x="256" y="272" fill="#6b665c" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace">after</text>
    <text x="456" y="272" fill="#a63d2f" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, monospace" text-anchor="end" font-weight="600">1525.8</text>
  
    <rect x="488" y="52" width="208" height="200" rx="6" fill="#ffffff" stroke="rgba(43,41,37,0.12)" stroke-width="1"/>
    <path d="M 504.0 79.6 H 526.0 V 115.7 H 548.0 V 116.4 H 570.0 V 199.9 H 592.0 V 199.9 H 614.0 V 199.9 H 636.0 V 199.9 H 658.0 V 224.4 H 680.0 V 224.4" fill="none" stroke="#2b2925" stroke-width="1.2"/>
