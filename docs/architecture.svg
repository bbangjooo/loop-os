<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-os-arch-title loop-os-arch-desc">
    <title id="loop-os-arch-title">Loop OS three-layer architecture</title>
    <desc id="loop-os-arch-desc">Layer stack with the application layer (a project repository) on top, the OS layer of seven deterministic instruments in the middle, and the kernel experiment loop at the bottom; specs flow down the left side and sealed evidence flows up the right side, forming the agent-paced outer loop around the kernel's deterministic inner loop.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>

    <!-- side flows (drawn before boxes; straight verticals share an axis) -->
    <line x1="120" y1="72" x2="120" y2="536" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="40" y="284" width="64" height="14" rx="2" fill="#f5f5f5"/>
    <text x="72" y="294" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">SPECS</text>

    <line x1="880" y1="536" x2="880" y2="72" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="896" y="284" width="80" height="14" rx="2" fill="#f5f5f5"/>
    <text x="936" y="294" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">EVIDENCE</text>

    <!-- ===== L2 APPLICATION ===== -->
    <rect x="160" y="48" width="680" height="132" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="6"/>
    <rect x="176" y="64" width="24" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="188" y="74" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L2</text>
    <text x="212" y="75" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">APPLICATION</text>
    <text x="176" y="104" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Project repository</text>
    <text x="176" y="124" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">contract.toml · evaluator · data surfaces</text>
    <text x="176" y="140" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">.journal/ (events · notes · claims) · .journal-anchor.json</text>
    <text x="824" y="104" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">one dir per project</text>
    <text x="824" y="120" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">holdout lives outside</text>

    <!-- ===== L1 OS ===== -->
    <rect x="160" y="180" width="680" height="200" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1" rx="6"/>
    <rect x="176" y="196" width="24" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="188" y="206" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L1</text>
    <text x="212" y="207" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OS — AIMING INSTRUMENTS</text>
    <text x="176" y="236" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Deterministic instruments, judgment as files</text>

    <!-- instrument chips: 7 chips, 88px wide, 24px gap -> 7*88+6*8 = 664 too wide; use w=88 gap=8: 7*88+48=664 -> x from 176 -->
    <g font-family="'Geist Mono', monospace" font-size="10" text-anchor="middle">
      <rect x="176" y="252" width="80" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="216" y="270" fill="#2d3142">journal</text>
      <rect x="268" y="252" width="80" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="308" y="270" fill="#2d3142">aim</text>
      <rect x="360" y="252" width="80" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="400" y="270" fill="#2d3142">seal</text>
      <rect x="452" y="252" width="80" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="492" y="270" fill="#2d3142">steer</text>
      <rect x="544" y="252" width="80" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="584" y="270" fill="#2d3142">note</text>
      <rect x="636" y="252" width="80" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="676" y="270" fill="#2d3142">memory</text>
      <rect x="728" y="252" width="80" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="768" y="270" fill="#2d3142">jump</text>
    </g>

    <text x="176" y="308" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">outer loop · agent-paced :  aim → run → seal → diagnose → steer → (jump) → aim</text>
    <text x="176" y="328" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">runtime = the agent harness (Claude Code / Codex) — no daemon, no CLI product</text>
    <text x="176" y="344" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">LLM judgment enters only as digest-sealed files; ordering = data dependency</text>
    <text x="824" y="360" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">hash-chained journal = the only canonical record</text>

    <!-- ===== L0 KERNEL (focal) ===== -->
    <rect x="160" y="380" width="680" height="156" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" rx="6"/>
    <rect x="176" y="396" width="24" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
    <text x="188" y="406" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L0</text>
    <text x="212" y="407" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KERNEL</text>
    <text x="176" y="436" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">kernel/loop.py — bounded, reversible, budgeted hill-climb</text>
    <text x="176" y="460" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">inner loop · deterministic :  measure → agent mutates once → integrity pins → guards → commit / revert</text>
    <text x="176" y="484" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">scalar objective · finite budget · git-backed rollback · append-only ledger</text>
    <text x="176" y="500" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">domain-free, vendored byte-identical from upstream (VENDOR.json)</text>
    <text x="824" y="436" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">the only thing that runs</text>

    <!-- footer axis note -->
    <line x1="160" y1="568" x2="840" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="160" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AXIS</text>
    <text x="228" y="588" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">specs compile downward (intent → executable frame) · evidence seals upward (ledger → journal → claims)</text>
  </svg>
